name: Release

# This workflow handles latest, beta, and alpha releases:
# - Latest: Triggered by GitHub releases (tag vX.Y.Z)
# - Beta: Triggered by pushes to beta-X.Y.Z branches
# - Alpha: Triggered by pushes to alpha-X.Y.Z branches

on:
  release:
    types: [published]
  push:
    branches:
      - 'beta-*.*.*'
      - 'alpha-*.*.*'

permissions:
  id-token: write
  contents: read

# Cancel any in-progress workflow for the same branch. A new push should
# supersede the previous run rather than racing it to publish.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  npm-publish:
    name: Publish to npm
    if: ${{ github.repository == 'homebridge-plugins/homebridge-arlo' }}
    runs-on: ubuntu-latest
    outputs:
      npm_version: ${{ steps.pkg-version.outputs.version }}
      release_type: ${{ steps.release-type.outputs.type }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'

      - name: Upgrade npm for OIDC support
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Determine release type
        id: release-type
        run: |
          if [[ "${{ github.event_name }}" == "release" ]]; then
            echo "type=latest" >> "$GITHUB_OUTPUT"
            echo "tag=latest" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.ref }}" == refs/heads/beta-* ]]; then
            echo "type=beta" >> "$GITHUB_OUTPUT"
            echo "tag=beta" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.ref }}" == refs/heads/alpha-* ]]; then
            echo "type=alpha" >> "$GITHUB_OUTPUT"
            echo "tag=alpha" >> "$GITHUB_OUTPUT"
          else
            echo "type=none" >> "$GITHUB_OUTPUT"
            echo "tag=none" >> "$GITHUB_OUTPUT"
            echo "No valid release type detected - skipping publish"
          fi

      - name: Handle prerelease versioning
        if: steps.release-type.outputs.type == 'beta' || steps.release-type.outputs.type == 'alpha'
        run: |
          # Download versioning script from homebridge/.github
          mkdir -p .github
          wget -q https://raw.githubusercontent.com/homebridge/.github/latest/.github/npm-version-script.js -O .github/npm-version-script.js

          # Run the script to set base version (script requires the full ref, not just the branch name)
          node .github/npm-version-script.js ${{ github.ref }} ${{ steps.release-type.outputs.type }}

          # Add prerelease suffix
          npm version prerelease --preid=${{ steps.release-type.outputs.type }} --no-git-tag-version

      - name: Publish to npm with OIDC
        if: steps.release-type.outputs.type != 'none'
        run: npm publish --tag ${{ steps.release-type.outputs.tag }} --provenance --access public

      - name: Capture published version
        id: pkg-version
        if: steps.release-type.outputs.type != 'none'
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Write job summary
        if: steps.release-type.outputs.type != 'none'
        run: |
          {
            echo "### 📦 Published to npm"
            echo ""
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Version | \`${{ steps.pkg-version.outputs.version }}\` |"
            echo "| Dist-tag | \`${{ steps.release-type.outputs.tag }}\` |"
            echo "| Release type | \`${{ steps.release-type.outputs.type }}\` |"
            echo "| npm | [view package](https://www.npmjs.com/package/$(node -p "require('./package.json').name")/v/${{ steps.pkg-version.outputs.version }}) |"
          } >> "$GITHUB_STEP_SUMMARY"

  publish-gh-release:
    name: Publish GitHub Release
    needs: npm-publish
    permissions:
      contents: write
    if: |
      needs.npm-publish.result == 'success' &&
      github.repository == 'homebridge-plugins/node-arlo' &&
      (needs.npm-publish.outputs.release_type == 'beta' || needs.npm-publish.outputs.release_type == 'alpha')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Create nightly release
        id: create_release
        uses: viperproject/create-nightly-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ needs.npm-publish.outputs.npm_version }}
          release_name: v${{ needs.npm-publish.outputs.npm_version }}
          body: v${{ needs.npm-publish.outputs.npm_version }}
          keep_num: 5
          keep_tags: false

      - name: Generate release notes
        id: gen-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NOTES=$(gh api repos/${{ github.repository }}/releases/generate-notes \
            -f tag_name="v${{ needs.npm-publish.outputs.npm_version }}" \
            --jq '.body' 2>/dev/null || echo "")
          if [[ -z "$NOTES" ]]; then
            echo "::warning::Could not auto-generate release notes; falling back to empty notes"
          fi
          {
            echo "notes<<EOF"
            echo "$NOTES"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Update release body
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release edit "v${{ needs.npm-publish.outputs.npm_version }}" \
            --repo "${{ github.repository }}" \
            --notes "v${{ needs.npm-publish.outputs.npm_version }}

          ${{ steps.gen-notes.outputs.notes }}"

      - name: Write job summary
        run: |
          {
            echo "### 🏷️ GitHub Release Created"
            echo ""
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Tag | \`v${{ needs.npm-publish.outputs.npm_version }}\` |"
            echo "| Release | [view release](https://github.com/${{ github.repository }}/releases/tag/v${{ needs.npm-publish.outputs.npm_version }}) |"
          } >> "$GITHUB_STEP_SUMMARY"